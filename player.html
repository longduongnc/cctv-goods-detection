<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CCTV grocery data — clip review</title>
<style>
:root{
  color-scheme: dark;
  --bg:#0d1115; --surface:#161b21; --sunk:#11161b; --line:#28323a;
  --ink:#e9eef3; --ink-2:#a5b1bc; --ink-3:#74808c;
  --accent:#3987e5; --good:#0ca30c; --serious:#ec835a; --crit:#d03b3b;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;
  display:grid;grid-template-columns:300px 1fr;grid-template-rows:auto 1fr;height:100vh;overflow:hidden}
header{grid-column:1/-1;display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  padding:11px 18px;border-bottom:1px solid var(--line);background:var(--surface)}
header h1{font-size:14.5px;margin:0;font-weight:640;letter-spacing:-.01em}
.hint{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
kbd{font-family:var(--mono);font-size:10.5px;background:var(--sunk);border:1px solid var(--line);
  border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:var(--ink-2)}

aside{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--surface)}
.srcs{display:flex;gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.srcs button{flex:1;background:var(--surface);border:0;color:var(--ink-2);font-family:var(--mono);
  font-size:11px;padding:8px 4px;cursor:pointer}
.srcs button[aria-pressed=true]{background:var(--accent);color:#fff;font-weight:650}
.filters{display:flex;flex-wrap:wrap;gap:5px;padding:9px 10px;border-bottom:1px solid var(--line)}
.filters button{background:var(--sunk);border:1px solid var(--line);color:var(--ink-2);
  font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:99px;cursor:pointer}
.filters button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:650}
#list{overflow-y:auto;flex:1;min-height:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 11px;
  cursor:pointer;border-bottom:1px solid var(--sunk);font-family:var(--mono);font-size:11.5px;color:var(--ink-2)}
.row:hover{background:var(--sunk)}
.row[aria-current=true]{background:var(--accent);color:#fff}
.row .t{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:99px;
  border:1px solid currentColor;opacity:.9}
.t-take{color:#6fa8ea}.t-put{color:#4cc24c}.t-touch{color:var(--serious)}.t-none{color:var(--ink-3)}
.t-dup{color:#e87070}
.row[aria-current=true] .t{color:#fff}

main{display:flex;flex-direction:column;min-height:0;min-width:0;padding:16px 20px;gap:12px;overflow-y:auto}
.stage{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.pane{position:relative;line-height:0;background:#000;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.pane video{display:block;max-width:100%;height:auto}
.pane canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pane .lbl{position:absolute;left:8px;top:7px;font-family:var(--mono);font-size:10px;letter-spacing:.07em;
  text-transform:uppercase;color:#dfe7ee;background:rgba(6,10,14,.66);padding:2px 7px;border-radius:99px;
  border:1px solid rgba(255,255,255,.2)}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.bar button{background:var(--sunk);border:1px solid var(--line);color:var(--ink);border-radius:6px;
  padding:5px 11px;cursor:pointer;font-family:var(--mono);font-size:12px}
.bar button:hover{border-color:var(--accent)}
.track{flex:1;min-width:200px;height:20px;background:var(--sunk);border:1px solid var(--line);
  border-radius:5px;position:relative;overflow:hidden;cursor:pointer}
.act{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--crit) 55%,transparent)}
.play-head{position:absolute;top:0;bottom:0;width:2px;background:var(--ink)}
.meta{font-family:var(--mono);font-size:12px;color:var(--ink-3);line-height:1.75;
  background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:11px 14px;white-space:pre-wrap}
.meta b{color:var(--ink);font-weight:600}
.warn{background:color-mix(in srgb,var(--crit) 12%,var(--surface));border-color:color-mix(in srgb,var(--crit) 40%,transparent)}
.toggles{display:flex;gap:12px;font-family:var(--mono);font-size:11.5px;color:var(--ink-2);align-items:center}
.toggles label{display:flex;align-items:center;gap:5px;cursor:pointer}
.err{color:var(--serious);font-family:var(--mono);font-size:12px}
</style>
</head>
<body>
<header>
  <h1>CCTV grocery data &mdash; clip review</h1>
  <span class="hint" id="count"></span>
  <span class="hint"><kbd>&uarr;</kbd><kbd>&darr;</kbd> move &nbsp; <kbd>space</kbd> play/pause &nbsp; <kbd>,</kbd><kbd>.</kbd> step frame</span>
  <span class="hint" id="err"></span>
</header>

<aside>
  <div class="srcs" role="group" aria-label="Source">
    <button data-src="ra" aria-pressed="true">RetailAction</button>
    <button data-src="shop" aria-pressed="false">Shoplifting</button>
    <button data-src="intel" aria-pressed="false">Intel</button>
  </div>
  <div class="filters" id="filters"></div>
  <div id="list" tabindex="0"></div>
</aside>

<main>
  <div class="stage" id="stage"></div>
  <div class="bar">
    <button id="pp">play</button>
    <div class="track" id="track"><div class="act" id="act" hidden></div><div class="play-head" id="ph"></div></div>
    <span id="time" style="min-width:104px">0.00 / 0.00</span>
    <span class="toggles">
      <label><input type="checkbox" id="ovMark" checked> contact point</label>
      <label><input type="checkbox" id="ovHands" checked> hands</label>
      <label><input type="checkbox" id="ovSkel"> skeleton</label>
    </span>
  </div>
  <div class="meta" id="meta">Select a clip.</div>
</main>

<script>
const IDX_URL = 'index.json';
let IDX = null, SRC = 'ra', FILT = 'all', ROWS = [], CUR = -1, META = null, VIDS = [], RAF = 0;

const $ = s => document.querySelector(s);
const stage = $('#stage'), list = $('#list');

const FILTERS = {
  ra:   [['all','all'],['take','take'],['put','put'],['touch','touch'],['none','no action']],
  shop: [['all','all'],['dup','duplicates'],['uniq','unique']],
  intel:[['all','all']]
};

fetch(IDX_URL).then(r => r.json()).then(d => { IDX = d; renderFilters(); build(); })
  .catch(e => { $('#err').textContent =
    'Could not load index.json — run:  python3 -m http.server 8000  in this folder, then open localhost:8000/player.html'; });

function renderFilters(){
  $('#filters').innerHTML = FILTERS[SRC].map(([k,lab]) =>
    `<button data-f="${k}" aria-pressed="${k===FILT}">${lab}</button>`).join('');
  $('#filters').querySelectorAll('button').forEach(b => b.onclick = () => {
    FILT = b.dataset.f; renderFilters(); build();
  });
}

function build(){
  if (SRC === 'ra'){
    ROWS = IDX.ra.filter(x => FILT === 'all' || x.l === FILT)
                 .map(x => ({ id:x.id, tag:x.l, cls:'t-'+(x.l==='none'?'none':x.l) }));
  } else if (SRC === 'shop'){
    const dup = new Set(IDX.dup);
    ROWS = IDX.shop.filter(f => FILT==='all' || (FILT==='dup') === dup.has(f))
                   .map(f => ({ id:f, tag: dup.has(f) ? 'dup' : '', cls:'t-dup' }));
  } else {
    ROWS = IDX.intel.map(f => ({ id:f, tag:'', cls:'' }));
  }
  list.innerHTML = ROWS.map((r,i) =>
    `<div class="row" data-i="${i}" role="button" tabindex="-1">
       <span>${r.id.replace(/\.mp4$/,'')}</span>
       ${r.tag ? `<span class="t ${r.cls}">${r.tag}</span>` : ''}
     </div>`).join('');
  list.querySelectorAll('.row').forEach(el => el.onclick = () => select(+el.dataset.i));
  $('#count').textContent = ROWS.length + ' clips';
  if (ROWS.length) select(0); else { stage.innerHTML=''; $('#meta').textContent='Nothing matches.'; }
}

document.querySelectorAll('.srcs button').forEach(b => b.onclick = () => {
  SRC = b.dataset.src; FILT = 'all';
  document.querySelectorAll('.srcs button').forEach(o => o.setAttribute('aria-pressed', String(o===b)));
  renderFilters(); build();
});

function select(i){
  if (i < 0 || i >= ROWS.length) return;
  CUR = i;
  list.querySelectorAll('.row').forEach(el => el.setAttribute('aria-current', String(+el.dataset.i === i)));
  const el = list.querySelector(`.row[data-i="${i}"]`);
  if (el) el.scrollIntoView({block:'nearest'});
  load(ROWS[i]);
}

function pane(src, label, w){
  return `<div class="pane" style="flex:0 1 ${w}px">
    <video src="${src}" playsinline muted preload="auto"></video>
    <canvas></canvas><span class="lbl">${label}</span></div>`;
}

function load(row){
  cancelAnimationFrame(RAF);
  META = null; $('#act').hidden = true;
  const m = $('#meta'); m.classList.remove('warn');

  if (SRC === 'ra'){
    const b = `raw/ra_labeled/test/${row.id}`;
    stage.innerHTML = pane(`${b}/rank0_video.mp4`,'camera 1',430) + pane(`${b}/rank1_video.mp4`,'camera 2',430);
    fetch(`${b}/metadata.json`).then(r => r.json()).then(j => { META = j.content; paintMeta(row); });
  } else if (SRC === 'shop'){
    stage.innerHTML = pane(`raw/shoplifting_34data/${row.id}`,'single camera', 760);
    paintMeta(row);
  } else {
    stage.innerHTML = pane(`raw/intel_retail/VideoSumForRetailData/clips/${row.id}`,'camera', 860);
    paintMeta(row);
  }
  VIDS = [...stage.querySelectorAll('video')];
  VIDS.forEach(v => {
    v.onloadedmetadata = () => { sizeCanvas(); if (SRC === 'ra' && META) paintMeta(row); };
    v.onerror = () => { $('#err').textContent = 'Could not load ' + v.getAttribute('src'); };
  });
  VIDS[0].onplay = () => { $('#pp').textContent = 'pause';
    VIDS.slice(1).forEach(v => v.play().catch(()=>{})); };
  VIDS[0].onpause = () => { $('#pp').textContent = 'play'; VIDS.slice(1).forEach(v => v.pause()); };
  VIDS[0].play().catch(()=>{});
  tick();
}

function sizeCanvas(){
  stage.querySelectorAll('.pane').forEach(p => {
    const v = p.querySelector('video'), c = p.querySelector('canvas');
    c.width = v.videoWidth || 600; c.height = v.videoHeight || 600;
  });
}

function paintMeta(row){
  const m = $('#meta');
  if (SRC === 'ra'){
    if (!META) { m.textContent = 'loading…'; return; }
    const a = META.labels.action || [];
    const d = segDur(), ts = relTimes('rank0');
    const vdur = (VIDS[0] && VIDS[0].duration) || (ts ? ts.length/6 : 5.33);
    let s = `sample ${row.id}   ·   ${a.length} action${a.length===1?'':'s'}`
          + `   ·   segment ${d ? d.toFixed(2)+'s' : '?'} compressed into ${vdur.toFixed(2)}s of video`
          + `   ·   ${ts ? ts.length : '?'} frames @ 6 fps, two synchronized ceiling cameras\n`;
    if (!ts) s += `\n⚠ No frame timestamps on this sample — action times below are a linear approximation.`;
    if (!a.length) s += `\nNo action labelled — this is a deliberate negative (9.2% of the split).`;
    a.forEach((x,i) => {
      const sp = x.spatial ? x.spatial.action_cam : {};
      const w = actionWindow(x, 'rank0');
      s += `\naction ${i+1}:  ${x.label.toUpperCase()}`
        + `   video t = ${w[0].toFixed(2)}–${w[1].toFixed(2)}s`
        + (d ? `   (segment t = ${(x.start*d).toFixed(2)}–${(x.end*d).toFixed(2)}s)` : '');
      if (sp.rank0) s += `\n   cam1 contact  x ${sp.rank0.x.toFixed(3)}  y ${sp.rank0.y.toFixed(3)}`;
      if (sp.rank1) s += `\n   cam2 contact  x ${sp.rank1.x.toFixed(3)}  y ${sp.rank1.y.toFixed(3)}`;
    });
    m.textContent = s;
    if (a.length){
      const w = actionWindow(a[0], 'rank0'), st = $('#act');
      st.hidden = false;
      st.style.left = (100 * w[0] / vdur) + '%';
      st.style.width = (100 * (w[1] - w[0]) / vdur) + '%';
    }
  } else if (SRC === 'shop'){
    const isDup = IDX.dup.includes(row.id);
    m.textContent = `${row.id}   ·   704×576, 25 fps   ·   no annotations of any kind\n` +
      (isDup ? `\n⚠ This file is byte-for-byte identical to another clip in the set (218 such copies).`
             : `\nEvery clip in this set is the same camera in the same shop, recorded 2024-02-23.`);
    m.classList.toggle('warn', isDup);
  } else {
    m.textContent = `${row.id}   ·   1920×1080, 24 fps\n\n` + (IDX.intel_anno[row.id] || '(no description)');
  }
}

function segDur(){
  try{
    const s = META.segment_info;
    return (new Date(s.sampled_at_end) - new Date(s.sampled_at_start)) / 1000;
  } catch(e){ return null; }
}

// Frame i of the video happened at relTimes()[i] seconds into the real segment.
// The 32 frames are motion-sampled, so they are NOT evenly spaced — never map
// action.start/end onto the video timeline linearly.
function relTimes(rank){
  const cam = (META.action_cam || {})[rank] || {};
  const ts = cam.frame_timestamps;
  if (!ts || !ts.length) return null;
  const t0 = Date.parse(ts[0]);
  return ts.map(x => (Date.parse(x) - t0) / 1000);
}

function actionWindow(a, rank){
  const sd = segDur(), ts = relTimes(rank);
  const nf = ts ? ts.length : 32;
  if (!sd || !ts) return [a.start * nf / 6, a.end * nf / 6, false];
  const s = a.start * sd, e = a.end * sd;
  let idx = [];
  ts.forEach((t,i) => { if (t >= s && t <= e) idx.push(i); });
  if (!idx.length){
    const m = (s + e) / 2; let best = 0;
    ts.forEach((t,i) => { if (Math.abs(t - m) < Math.abs(ts[best] - m)) best = i; });
    idx = [best];
  }
  return [idx[0] / 6, (idx[idx.length-1] + 1) / 6, true];
}

const BONES = [['neck','right_shoulder'],['neck','left_shoulder'],['right_shoulder','right_elbow'],
  ['right_elbow','right_wrist'],['right_wrist','right_hand'],['left_shoulder','left_elbow'],
  ['left_elbow','left_wrist'],['left_wrist','left_hand'],['neck','middle_of_waist'],
  ['middle_of_waist','right_hip'],['middle_of_waist','left_hip'],['right_hip','right_knee'],
  ['right_knee','right_ankle'],['left_hip','left_knee'],['left_knee','left_ankle'],['neck','top_of_head']];

function tick(){
  RAF = requestAnimationFrame(tick);
  const v0 = VIDS[0]; if (!v0) return;
  // keep the second camera locked to the first
  VIDS.slice(1).forEach(v => { if (Math.abs(v.currentTime - v0.currentTime) > 0.14) v.currentTime = v0.currentTime; });
  const dur = v0.duration || segDur() || 1;
  $('#ph').style.left = (100 * v0.currentTime / dur) + '%';
  $('#time').textContent = v0.currentTime.toFixed(2) + ' / ' + dur.toFixed(2);

  stage.querySelectorAll('.pane').forEach((p, pi) => {
    const c = p.querySelector('canvas'), g = c.getContext('2d');
    g.clearRect(0,0,c.width,c.height);
    if (SRC !== 'ra' || !META) return;
    const rank = 'rank' + pi, cam = META.action_cam[rank];
    const d = segDur(), t = v0.currentTime;
    const a = META.labels.action || [];

    if ($('#ovHands').checked || $('#ovSkel').checked){
      const ps = (cam && cam.poses) || [];
      const fi = Math.min(ps.length - 1, Math.max(0, Math.round(t / d * (ps.length - 1))));
      const P = ps[fi];
      if (P && P.pose){
        const sc = P.joint_scores || {}, pt = j => P.pose[j] && (sc[j]||0) > 0.3
          ? [P.pose[j][0]*c.width, P.pose[j][1]*c.height] : null;
        if ($('#ovSkel').checked){
          g.strokeStyle = 'rgba(0,200,255,.72)'; g.lineWidth = 2.5;
          BONES.forEach(([x,y]) => { const A = pt(x), B = pt(y);
            if (A && B){ g.beginPath(); g.moveTo(A[0],A[1]); g.lineTo(B[0],B[1]); g.stroke(); } });
        }
        if ($('#ovHands').checked){
          ['right_hand','left_hand'].forEach(j => { const A = pt(j); if (!A) return;
            g.strokeStyle = '#00c8ff'; g.lineWidth = 3;
            g.beginPath(); g.arc(A[0],A[1],11,0,7); g.stroke(); });
        }
      }
    }

    if ($('#ovMark').checked){
      a.forEach(x => {
        const sp = x.spatial && x.spatial.action_cam && x.spatial.action_cam[rank];
        if (!sp) return;
        const X = sp.x * c.width, Y = sp.y * c.height;
        const w = actionWindow(x, rank);
        const live = t >= w[0] && t <= w[1];
        g.strokeStyle = live ? '#ff2d2d' : 'rgba(255,60,60,.62)';
        g.lineWidth = live ? 4 : 2.5;
        g.strokeRect(X-15, Y-15, 30, 30);
        g.beginPath();
        [[-26,0,-16,0],[16,0,26,0],[0,-26,0,-16],[0,16,0,26]].forEach(s => {
          g.moveTo(X+s[0], Y+s[1]); g.lineTo(X+s[2], Y+s[3]); });
        g.stroke();
        if (live){
          g.strokeStyle = '#ff2d2d'; g.lineWidth = 6;
          g.strokeRect(3,3,c.width-6,c.height-6);
          g.fillStyle = '#ff2d2d'; g.font = 'bold 22px ui-monospace,Menlo,monospace';
          g.fillText(x.label.toUpperCase(), 14, c.height - 16);
        }
      });
    }
  });
}

$('#pp').onclick = () => { const v = VIDS[0]; if (!v) return; v.paused ? v.play() : v.pause(); };
$('#track').onclick = e => {
  const r = e.currentTarget.getBoundingClientRect(), f = (e.clientX - r.left) / r.width;
  VIDS.forEach(v => v.currentTime = f * (v.duration || 0));
};
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const v = VIDS[0];
  if (e.key === 'ArrowDown'){ e.preventDefault(); select(CUR+1); }
  else if (e.key === 'ArrowUp'){ e.preventDefault(); select(CUR-1); }
  else if (e.key === ' '){ e.preventDefault(); if (v) v.paused ? v.play() : v.pause(); }
  else if (e.key === ','){ if (v){ v.pause(); VIDS.forEach(x => x.currentTime = Math.max(0, x.currentTime - 1/6)); } }
  else if (e.key === '.'){ if (v){ v.pause(); VIDS.forEach(x => x.currentTime += 1/6); } }
});
</script>
</body>
</html>
